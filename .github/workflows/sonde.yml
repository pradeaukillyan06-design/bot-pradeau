name: sonde
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python outils/sonde.py outils/sonde_adresses.json sonde_resultats.json
      - run: |
          git config user.name "bot-pradeau"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan sonde-resultats
          git rm -rq --cached .
          git add sonde_resultats.json
          git commit -qm "résultats sonde"
          git push -f origin sonde-resultats
