name: audit
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python outils/audit.py
      - run: |
          git config user.name "bot-pradeau"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan audit-resultats
          git rm -rq --cached .
          git add audit_resultats.json
          git commit -qm "résultats audit"
          git push -f origin audit-resultats
